[theme]
base = "dark"
primaryColor = "#5EA7FF"
backgroundColor = "#070B12"
secondaryBackgroundColor = "#0D1420"
textColor = "#F4F7FB"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50

[runner]
fastReruns = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
showSidebarNavigation = false
