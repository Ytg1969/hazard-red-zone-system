# Paste only the settings you actually have into Streamlit Community Cloud → App settings → Secrets.
# Root-level Streamlit secrets are also exposed as environment variables to the app.
# Do not commit credentials, API tokens, passwords, or private signed URLs.

# Validated operational settlement/site feeds:
# SIH_HABITATION_CSV_URL = "https://official-source.example.gov.in/habitations.csv"
# SIH_SHELTER_CSV_URL = "https://official-source.example.gov.in/relocation-sites.csv"

# Enable only after the two operational feeds above have been tested end-to-end.
# SIH_REQUIRE_OPERATIONAL_DATA = "true"

# Optional calibrated hazard GeoJSON. Do not enable the confirmation flag merely because a URL works.
# SIH_HAZARD_GEOJSON_URL = "https://official-source.example.gov.in/calibrated-hazard.geojson"
# SIH_HAZARD_CALIBRATION_CONFIRMED = "true"
# SIH_HAZARD_SOURCE_LABEL = "Agency / layer / reference period"

# Optional NDMA SACHET CAP/RSS context. WMO registers this URL for NDMA India.
# Keep unset when deterministic offline-only behavior is preferred.
# SIH_SACHET_FEED_URL = "https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml"
# Verification: https://alertingauthority.wmo.int/authorities.php?recId=331
# NDMA guide: https://sachet.ndma.gov.in/docs/Integration_Guide_For_Agencies.pdf
# Do not invent a per-alert CAP identifier.

# Local GraphML paths usually do not apply to Streamlit Community Cloud.
# Leave unset there so routing can use OSRM and explicit fallback behavior.
# SIH_ROAD_GRAPHML = "/persistent/path/roads.graphml"
