name: Streamlit Site Verification

on:
  workflow_run:
    workflows: ["Deployment Smoke"]
    types: [completed]
  workflow_dispatch:

jobs:
  public-site:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      STREAMLIT_APP_URL: https://hazard-red-zone-system-qmi7oeaai7ewky3bfmrnpr.streamlit.app

    steps:
      - name: Wake and wait for public Streamlit endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            root_code="$(curl --silent --show-error --max-time 30 -o /tmp/streamlit-root.html -D /tmp/streamlit-root.headers -w '%{http_code}' "$STREAMLIT_APP_URL/" || true)"
            root_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/streamlit-root.headers 2>/dev/null || true)"
            health_code="$(curl --silent --show-error --max-time 20 -o /tmp/streamlit-health.txt -w '%{http_code}' "$STREAMLIT_APP_URL/_stcore/health" || true)"
            health_body="$(tr -d '\r\n' < /tmp/streamlit-health.txt 2>/dev/null || true)"
            echo "Attempt $attempt/60: root=$root_code location=${root_location:-<none>} health=$health_code body=${health_body:-<empty>}"
            if [[ "$root_code" =~ ^2[0-9][0-9]$ || "$root_code" =~ ^3[0-9][0-9]$ ]]; then
              echo "Streamlit host is responding; continuing to browser verification."
              exit 0
            fi
            sleep 10
          done
          echo "Streamlit host did not become reachable in time."
          exit 1

      - name: Install browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Browser-smoke every public app page
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          from playwright.sync_api import sync_playwright

          base = os.environ["STREAMLIT_APP_URL"].rstrip("/")
          pages = [
              ("home", "/"),
              ("operations-hub", "/Operations_Hub"),
              ("command-center", "/Command_Center"),
              ("red-zone-map", "/Red_Zone_Map"),
              ("risk-analysis", "/Risk_Analysis"),
              ("relocation-planner", "/Relocation_Planner"),
              ("scenario-studio", "/Scenario_Studio"),
              ("methodology", "/Methodology"),
              ("live-data-context", "/Live_Data_Context"),
              ("system-readiness", "/System_Readiness"),
              ("operational-data", "/Operational_Data"),
              ("gis-source-inspector", "/GIS_Source_Inspector"),
              ("calibrated-hazard-source", "/Calibrated_Hazard_Source"),
              ("schema-mapper", "/Schema_Mapper"),
              ("briefing", "/Briefing"),
              ("evidence-center", "/Evidence_Center"),
              ("system-boundaries", "/About_System"),
          ]
          release_routes = [
              ("briefing", "/Briefing"),
              ("evidence-center", "/Evidence_Center"),
              ("system-boundaries", "/About_System"),
          ]
          fatal_markers = [
              "ModuleNotFoundError",
              "ImportError",
              "Traceback:",
              "This app has encountered an error",
          ]
          auth_markers = [
              "share.streamlit.io/-/auth",
              "/auth/app",
          ]

          def normalized_path(value: str) -> str:
              path = urlsplit(value).path or "/"
              return path.rstrip("/") or "/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000})

              # Streamlit resolves an unknown page client-side after the initial
              # document arrives. Give the router time to settle before deciding
              # that a newly introduced route is actually registered.
              for attempt in range(1, 26):
                  pending = []
                  for label, path in release_routes:
                      response = page.goto(base + path, wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(6000)
                      status = response.status if response else 0
                      final_url = page.url
                      final_path = normalized_path(final_url)
                      expected_path = normalized_path(path)
                      auth_hits = [marker for marker in auth_markers if marker in final_url]
                      if status >= 400 or auth_hits or final_path != expected_path:
                          pending.append(f"{label}: HTTP {status}, final path {final_path}")
                  if not pending:
                      print(f"Release routes registered after {attempt} attempt(s).")
                      break
                  if attempt == 25:
                      browser.close()
                      raise SystemExit(
                          "Public Streamlit deployment did not register release routes: " + " | ".join(pending)
                      )
                  print(f"WAIT release routes attempt {attempt}/25: " + " | ".join(pending))
                  page.wait_for_timeout(10000)

              failures = []
              for label, path in pages:
                  url = base + path
                  response = page.goto(url, wait_until="domcontentloaded", timeout=90000)
                  page.wait_for_timeout(6000)
                  status = response.status if response else 0
                  final_url = page.url
                  final_path = normalized_path(final_url)
                  expected_path = normalized_path(path)
                  body = page.locator("body").inner_text(timeout=30000)
                  hits = [marker for marker in fatal_markers if marker in body]
                  auth_hits = [marker for marker in auth_markers if marker in final_url]
                  if status >= 400:
                      failures.append(f"{label}: HTTP {status}")
                  if auth_hits:
                      failures.append(f"{label}: redirected to Streamlit authentication ({final_url})")
                  if final_path != expected_path:
                      failures.append(
                          f"{label}: resolved to {final_path} instead of expected route {expected_path}"
                      )
                  if hits:
                      failures.append(f"{label}: {', '.join(hits)}")
                  if status < 400 and not auth_hits and final_path == expected_path and not hits:
                      print(
                          f"PASS {label}: HTTP {status}, route {final_path}, no fatal Streamlit error markers"
                      )
              browser.close()

          if failures:
              raise SystemExit("Public Streamlit page smoke failed: " + " | ".join(failures))
          PY
