name: Streamlit Site Verification

on:
  workflow_run:
    workflows: ["Deployment Smoke"]
    types: [completed]
  workflow_dispatch:

jobs:
  public-site:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      STREAMLIT_APP_URL: https://hazard-red-zone-system-qmi7oeaai7ewky3bfmrnpr.streamlit.app

    steps:
      - name: Wake and wait for public Streamlit endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            root_code="$(curl -L --silent --show-error --max-time 30 -o /tmp/streamlit-root.html -w '%{http_code}' "$STREAMLIT_APP_URL/" || true)"
            health_code="$(curl --silent --show-error --max-time 20 -o /tmp/streamlit-health.txt -w '%{http_code}' "$STREAMLIT_APP_URL/_stcore/health" || true)"
            health_body="$(tr -d '\r\n' < /tmp/streamlit-health.txt 2>/dev/null || true)"
            echo "Attempt $attempt/30: root=$root_code health=$health_code body=${health_body:-<empty>}"
            if [[ "$root_code" =~ ^2[0-9][0-9]$ || "$root_code" =~ ^3[0-9][0-9]$ ]]; then
              echo "Public Streamlit endpoint is reachable; continuing to browser smoke."
              exit 0
            fi
            sleep 10
          done
          echo "Public Streamlit endpoint did not become reachable in time."
          exit 1

      - name: Install browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Browser-smoke public app pages
        shell: bash
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          base = os.environ["STREAMLIT_APP_URL"].rstrip("/")
          pages = [
              ("home", base + "/"),
              ("red-zone-map", base + "/Red_Zone_Map"),
              ("risk-analysis", base + "/Risk_Analysis"),
              ("relocation-planner", base + "/Relocation_Planner"),
          ]
          fatal_markers = [
              "ModuleNotFoundError",
              "ImportError",
              "Traceback:",
              "This app has encountered an error",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              failures = []
              for label, url in pages:
                  response = page.goto(url, wait_until="domcontentloaded", timeout=90000)
                  page.wait_for_timeout(8000)
                  status = response.status if response else 0
                  body = page.locator("body").inner_text(timeout=30000)
                  hits = [marker for marker in fatal_markers if marker in body]
                  if status >= 400:
                      failures.append(f"{label}: HTTP {status}")
                  if hits:
                      failures.append(f"{label}: {', '.join(hits)}")
                  if status < 400 and not hits:
                      print(f"PASS {label}: HTTP {status}, no fatal Streamlit error markers")
              browser.close()

          if failures:
              raise SystemExit("Public Streamlit page smoke failed: " + " | ".join(failures))
          PY
