name: Streamlit Site Verification

on:
  workflow_run:
    workflows: ["Deployment Smoke"]
    types: [completed]
  workflow_dispatch:

jobs:
  public-site:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      STREAMLIT_APP_URL: https://hazard-red-zone-system-qmi7oeaai7ewky3bfmrnpr.streamlit.app

    steps:
      - name: Wait for Streamlit health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "$STREAMLIT_APP_URL/_stcore/health" | grep -qi "ok"; then
              echo "Public Streamlit health endpoint is ready."
              exit 0
            fi
            echo "Waiting for Streamlit deployment ($attempt/30)..."
            sleep 10
          done
          echo "Public Streamlit deployment did not become healthy in time."
          exit 1

      - name: Install browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Browser-smoke public app pages
        shell: bash
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          base = os.environ["STREAMLIT_APP_URL"].rstrip("/")
          pages = [
              ("home", base + "/"),
              ("red-zone-map", base + "/Red_Zone_Map"),
              ("risk-analysis", base + "/Risk_Analysis"),
              ("relocation-planner", base + "/Relocation_Planner"),
          ]
          fatal_markers = [
              "ModuleNotFoundError",
              "ImportError",
              "Traceback:",
              "This app has encountered an error",
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000})
              failures = []
              for label, url in pages:
                  page.goto(url, wait_until="domcontentloaded", timeout=90000)
                  page.wait_for_timeout(8000)
                  body = page.locator("body").inner_text(timeout=30000)
                  hits = [marker for marker in fatal_markers if marker in body]
                  if hits:
                      failures.append(f"{label}: {', '.join(hits)}")
                  else:
                      print(f"PASS {label}: no fatal Streamlit error markers")
              browser.close()

          if failures:
              raise SystemExit("Public Streamlit page smoke failed: " + " | ".join(failures))
          PY
