name: Build Offline Field Bundle

on:
  workflow_dispatch:
    inputs:
      road_scope:
        description: Road networks to include in the offline bundle
        required: true
        default: puri
        type: choice
        options:
          - puri
          - all-demo-cities

jobs:
  windows-field-bundle:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Windows offline wheelhouse
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          New-Item -ItemType Directory -Force wheelhouse | Out-Null
          python -m pip download --only-binary=:all: -r requirements.txt -d wheelhouse
          python -m pip install --no-index --find-links wheelhouse -r requirements.txt

      - name: Cache road network
        shell: pwsh
        run: |
          if ("${{ inputs.road_scope }}" -eq "all-demo-cities") {
            python scripts/cache_road_network.py --demo-cities
          } else {
            python scripts/cache_road_network.py "Puri, Odisha, India"
          }

      - name: Run strict offline field preflight
        shell: pwsh
        run: |
          $env:SIH_OFFLINE_MODE = "true"
          $env:SIH_REQUIRE_OPERATIONAL_DATA = "false"
          python scripts/field_preflight.py --strict-road-cache --json | Tee-Object -FilePath field_preflight.json

      - name: Prepare ready-to-copy bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force field-bundle | Out-Null
          robocopy . field-bundle\hazard-red-zone-system /E /XD .git .github field-bundle wheelhouse .pytest_cache __pycache__ /XF *.pyc
          $copyCode = $LASTEXITCODE
          if ($copyCode -gt 7) { exit $copyCode }

          Copy-Item wheelhouse field-bundle\wheelhouse -Recurse
          Copy-Item field_preflight.json field-bundle\field_preflight.json
          Copy-Item scripts\windows\INSTALL_OFFLINE.ps1 field-bundle\INSTALL_OFFLINE.ps1
          Copy-Item scripts\windows\START_OFFLINE.cmd field-bundle\START_OFFLINE.cmd

          $buildUtc = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          @"
          HAZARD COMMAND — OFFLINE FIELD BUNDLE BUILD RECORD
          repository=${{ github.repository }}
          commit_sha=${{ github.sha }}
          workflow=${{ github.workflow }}
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          road_scope=${{ inputs.road_scope }}
          built_at_utc=$buildUtc
          "@ | Set-Content -Encoding UTF8 field-bundle\BUILD_INFO.txt

          @"
          HAZARD COMMAND — WINDOWS OFFLINE FIELD BUNDLE

          Target runtime: 64-bit Windows with Python 3.12 already installed.
          This bundle contains the application, an offline Windows wheelhouse,
          the requested OpenStreetMap GraphML road cache, and two launch helpers.

          FIRST TIME ON EACH LAPTOP
          -------------------------
          1. Right-click INSTALL_OFFLINE.ps1 and choose Run with PowerShell.
             It creates hazard-red-zone-system\.venv, installs only from the
             bundled wheelhouse, and requires strict cached-road preflight to pass.

          EVERY DEMO / REHEARSAL
          ----------------------
          2. Double-click START_OFFLINE.cmd.
             It reruns strict field preflight, then starts Streamlit in OFFLINE/LAN mode.

          3. Keep the command window open while using the app.
          4. Put the phone on the same Wi-Fi/hotspot and open the LAN URL printed by the launcher.

          Manual fallback commands are documented in docs\build_field_bundle.md.
          Keep field_preflight.json with the bundle as the build-time readiness record.
          Keep BUILD_INFO.txt with the bundle so the exact GitHub commit/run and road scope remain traceable.
          "@ | Set-Content -Encoding UTF8 field-bundle\README_FIRST.txt

      - name: Prove bundle installer works offline
        shell: pwsh
        run: |
          & .\field-bundle\INSTALL_OFFLINE.ps1
          if (-not (Test-Path .\field-bundle\INSTALL_OK.txt)) {
            throw "Bundle installer did not produce INSTALL_OK.txt"
          }
          Remove-Item .\field-bundle\hazard-red-zone-system\.venv -Recurse -Force
          Remove-Item .\field-bundle\INSTALL_OK.txt -Force

      - name: Upload offline field bundle
        uses: actions/upload-artifact@v4
        with:
          name: hazard-command-windows-offline-${{ github.run_number }}
          path: field-bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
